# Keep the desktop self-update baseline current.
#
# The DeepSeek Harness desktop shell on this machine points its self-updater at
# this fork (`DSH_DESKTOP_UPDATE_REPO=wanghongjian0119/deepseek-harness`). The
# updater reads `GET /repos/<repo>/commits/master`, so `master` must stay equal
# to `deepseek-ai/deepseek-harness@master` plus the MCP connection-attempt
# budget fix — otherwise the desktop shell either misses upstream releases or
# loses the fix that keeps an unresponsive MCP server from blocking startup.
#
# The fix cannot be contributed upstream: the official repository reports
# `has_pull_requests: false` and `has_issues: false` (checked 2026-09-18), so
# `POST /repos/deepseek-ai/deepseek-harness/pulls` fails and this fork is the
# permanent carrier rather than a stopgap.
#
# This workflow merges upstream master into `master` and never rewrites it. The
# earlier design cherry-picked the fix onto upstream and force-pushed, which
# minted a new commit id on every sync; the running shell records the commit it
# was built from and the updater will install a branch head only when that
# recorded commit is an ancestor of it, so each rewrite stranded the installed
# payload and the update center answered `unknown` ("无法确认更新源…新"). A merge
# keeps every commit that ever ran reachable, so the relation the updater checks
# stays true across syncs: the old head is always an ancestor of the new one.
#
# The fix is therefore carried as ordinary commits in `master`'s history; this
# workflow only verifies one is still present, and fails rather than let a
# conflict resolution drop it.
#
# Conflicts are split by whether the file is authored or generated, because the
# two classes need opposite treatment.
#
# `pnpm-lock.yaml` and the `desktop-linux/deploy-root/package.json` closure are
# generated from the workspace, and `*.i18n.yaml` records are hashes of the
# documents they pair. A line-level merge of two generations of a generated file
# means nothing, so the job replaces `pnpm-lock.yaml` with upstream's copy and
# regenerates it over the merged workspace, regenerates the deploy root, and
# re-records every pairing whose documents the merge combined. What it pushes is
# therefore always one coherent generation rather than a blend of two. This is
# the class that stalled the schedule from 2026-10-09 to 2026-10-14: the
# committed lockfile was a hand-regenerated generation, upstream rewrote its own
# in the same regions, and the merge conflicted on every single run until a
# human merged by hand.
#
# Every other conflict — source, packaging, prose — is still left unresolved on
# purpose: the job fails and `master` keeps serving the previous baseline until
# a human merges. Resolving those automatically would silently drop whichever
# side lost, which is the failure the whole design exists to prevent.
#
# This file lives on the `ci` branch, which is this fork's default branch, so
# the schedule fires without adding commits to `master`.
name: sync-desktop-baseline

on:
  schedule:
    # 01:23 Asia/Shanghai; upstream cuts releases most days.
    - cron: '23 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-desktop-baseline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The generated artifacts below are regenerated with the workspace's own
      # tooling, so the job needs the toolchain the repository pins.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Merge upstream master into the desktop baseline
        id: merge
        env:
          UPSTREAM_URL: https://github.com/deepseek-ai/deepseek-harness.git
        run: |
          set -euo pipefail
          git config user.name 'dsh-desktop-baseline'
          git config user.email 'dsh-desktop-baseline@users.noreply.github.com'
          git fetch --no-tags "$UPSTREAM_URL" master:refs/remotes/upstream/master
          git fetch --no-tags origin master:refs/remotes/origin/master
          upstream="$(git rev-parse refs/remotes/upstream/master)"
          baseline="$(git rev-parse refs/remotes/origin/master)"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "synced=false" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream" "$baseline"; then
            echo "master already contains upstream/master; nothing to do"
            exit 0
          fi

          git switch --detach "$baseline"
          # --no-commit so the regenerated artifacts join the merge commit
          # instead of trailing it in a second commit that the updater would
          # never resolve to a source ref.
          merge_failed=0
          git -c core.hooksPath=/dev/null merge --no-commit --no-edit "$upstream" || merge_failed=1

          if [ "$merge_failed" -ne 0 ]; then
            resolvable=1
            while IFS= read -r path; do
              case "$path" in
                pnpm-lock.yaml | *.i18n.yaml)
                  echo "::notice file=$path::generated artifact; replaced with upstream's generation and regenerated below"
                  ;;
                *)
                  echo "::error file=$path::conflicted"
                  resolvable=0
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
            if [ "$resolvable" -ne 1 ]; then
              echo "::error::upstream/master conflicts with the desktop baseline outside the generated artifacts; resolve it on master and re-run"
              exit 1
            fi
          fi

          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate the artifacts the merge replaced
        if: steps.merge.outputs.synced == 'true'
        env:
          UPSTREAM: ${{ steps.merge.outputs.upstream }}
        run: |
          set -euo pipefail
          conflicted="$(git diff --name-only --diff-filter=U)"

          # Both generated artifacts start from upstream's bytes: the lockfile
          # keeps upstream's resolution, and a pairing record gets its doc
          # hashes recomputed from the merged documents rather than from either
          # side of the conflict.
          git checkout "$UPSTREAM" -- pnpm-lock.yaml

          anchors=""
          while IFS= read -r path; do
            case "$path" in
              *.i18n.yaml)
                git checkout "$UPSTREAM" -- "$path"
                anchors="$anchors ${path%.i18n.yaml}.md"
                ;;
            esac
          done <<< "$conflicted"

          # The first install makes the workspace's tooling available; the
          # second absorbs the deploy-root manifest regenerated below, which is
          # itself a workspace member and so owns a lockfile importer entry.
          pnpm install --no-frozen-lockfile
          pnpm exec tsx desktop-linux/scripts/generate-deploy-root.ts
          pnpm install --no-frozen-lockfile

          if [ -n "$anchors" ]; then
            # shellcheck disable=SC2086 # deliberately split into anchor paths
            pnpm run verify-translation-pairing --write $anchors
          fi

          # A conflict this job resolved is expected to leave every pair
          # consistent; a failure here is a pair the merge combined in a way
          # only a human can confirm, and it must not reach master.
          pnpm run verify-translation-pairing
          pnpm exec tsx scripts/verify-runtime-closure.ts --manifest desktop-linux/deploy-root/package.json

      - name: Commit and push the merge
        if: steps.merge.outputs.synced == 'true'
        env:
          BASELINE: ${{ steps.merge.outputs.baseline }}
          FIX_SUBJECT: 'fix(mcp-client): bound one connection attempt'
        run: |
          set -euo pipefail
          # The workspace postinstall installs lefthook into this checkout, and
          # the merge commit contains upstream's own content: repository hooks
          # have nothing to say about either and must not gate the sync.
          hooks=-c\ core.hooksPath=/dev/null
          git add --all
          if git diff --quiet --cached "$BASELINE"; then
            echo "merge added no content; nothing to push"
            git merge --abort || git reset --hard "$BASELINE"
            exit 0
          fi
          git $hooks commit --no-edit

          # An automated resolution must not be able to ship a master that
          # cannot build: the desktop shell only exists on this branch, and a
          # `Sync fork` reset upstream has already deleted it once.
          test -d desktop-linux || {
            echo "::error::the merge dropped desktop-linux/; refusing to push"
            exit 1
          }
          # A conflict resolution that takes upstream wholesale would silently
          # drop the fix, and the updater cannot detect that.
          git log --oneline --grep="$FIX_SUBJECT" HEAD | grep -q . || {
            echo "::error::the merge no longer contains the MCP startup-budget fix"
            exit 1
          }

          # Fast-forward from the previous baseline in the normal case, forced
          # only when master had to be reattached to upstream by hand. The lease
          # pins the head this job read, so a concurrent push is rejected.
          git $hooks push --force-with-lease=refs/heads/master:"$BASELINE" origin HEAD:refs/heads/master
